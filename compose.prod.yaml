# =============================================================================
# Production environment
# =============================================================================
# Services: Nginx (web), PHP-FPM, PostgreSQL, Redis and MongoDB.
# The PHP-FPM image builds the frontend assets (Vite) in a node stage and
# shares them with Nginx via the `laravel-public-assets` named volume so the
# Vite manifest stays consistent between the two services.
#
# Usage:
#   docker compose -f compose.prod.yaml up -d --build
#   docker compose -f compose.prod.yaml down
# =============================================================================
services:
  web:
    build:
      context: .
      dockerfile: ./docker/production/nginx/Dockerfile
    restart: unless-stopped
    volumes:
      # Read-only access to the persistent storage and the built assets.
      - laravel-storage-production:/var/www/storage:ro
      - laravel-public-assets:/var/www/public/build:ro
    networks:
      - laravel-production
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      php-fpm:
        condition: service_healthy

  php-fpm:
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: production
    restart: unless-stopped
    volumes:
      - laravel-public-assets:/var/www/public/build
      - laravel-storage-production:/var/www/storage
    env_file:
      - .env
    networks:
      - laravel-production
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    user: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-app}
      - POSTGRES_USER=${POSTGRES_USERNAME:-laravel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres-data-production:/var/lib/postgresql/data
    networks:
      - laravel-production
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - laravel-production
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USERNAME:-laravel}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD:-secret}
      - MONGO_INITDB_DATABASE=${MONGODB_DATABASE:-laravel_app}
    volumes:
      - mongo-data-production:/data/db
    networks:
      - laravel-production
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  laravel-production:

volumes:
  postgres-data-production:
  mongo-data-production:
  laravel-storage-production:
  laravel-public-assets:
